[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mass-classification"
version = "0.1.0"
description = "Auditable multimodal classification and investigation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.12,<1",
  "psycopg[binary,pool]>=3.2,<4", "pgvector>=0.3,<1", "redis>=5,<8",
  "numpy>=1.26,<3", "networkx>=3.3,<4", "scikit-learn>=1.5,<2",
  "sentence-transformers>=3,<6", "spacy>=3.8,<4", "vaderSentiment>=3.3,<4",
  "PyMuPDF>=1.24,<2", "python-docx>=1.1,<2", "openpyxl>=3.1,<4",
  "Pillow>=10,<13", "pytesseract>=0.3,<1", "extract-msg>=0.50,<1",
  "faster-whisper>=1,<2", "langdetect>=1.0.9,<2", "prometheus-client>=0.20,<1",
  "reportlab>=4,<5", "boto3>=1.35,<2", "feedparser>=6,<7", "paramiko>=3,<5",
  "pymongo>=4,<5", "kafka-python>=2,<3", "PyYAML>=6,<7", "httpx>=0.27,<1"
]

[project.optional-dependencies]
topology = ["gudhi>=3.10,<4", "torch>=2.4,<3"]
train = ["torch>=2.4,<3", "shap>=0.46,<1"]
explain = ["shap>=0.46,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
mass-worker = "mass_classification.worker:main"
mass-train = "mass_classification.training:main"
mass-connector = "mass_classification.connectors:main"
mass-tune-embeddings = "mass_classification.tune_embeddings:main"
mass-reindex = "mass_classification.reindex:main"

[tool.setuptools.package-data]
mass_classification = ["static/*", "migrations/*.sql"]

[tool.setuptools.packages.find]
include = ["mass_classification*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
