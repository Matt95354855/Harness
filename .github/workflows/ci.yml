name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      LLM_PROVIDER: mock
      SEARCH_PROVIDER: fixture
      LOG_CONSOLE: 'false'
      PERSIST_MEMORY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, typecheck, test and build
        run: npm run check
      - name: Verify offline CLI
        run: |
          npm run doctor
          npm run demo -- --json
      - name: Verify executable examples
        run: |
          npm run example:basic
          npm run example:multi-hop
          npm run example:advanced
      - name: Measure offline harness overhead
        if: matrix.node == 24
        run: npm run benchmark

  mass-classification-demo:
    name: Mass Classification demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mass-classification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/mass-classification/requirements-demo.txt
      - name: Install demo dependencies
        run: python -m pip install -r requirements-demo.txt pytest httpx
      - name: Verify Python sources
        run: python -m compileall -q mass_classification
      - name: Verify discovery workflow
        run: python -m pytest -q tests/test_demo.py
