services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mass
      POSTGRES_USER: mass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mass"]
      interval: 10s
      retries: 6
    networks: [internal]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    networks: [internal]
  api:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    volumes: ["data:/var/lib/mass/data", "models:/var/lib/mass/models"]
    ports: ["127.0.0.1:8000:8000"]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
  worker:
    build: .
    command: ["mass-worker"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    volumes: ["data:/var/lib/mass/data", "models:/var/lib/mass/models"]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
networks:
  internal: {}
volumes:
  db: {}
  redis: {}
  data: {}
  models: {}
